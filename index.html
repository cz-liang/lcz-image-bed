<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>GitHub图床管理工具</title>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      max-width: 800px;
      margin: 20px auto;
      padding: 0 20px;
      font-family: Arial, sans-serif;
    }
    .item {
      padding: 10px;
      border: 1px solid #eee;
      margin: 8px 0;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .preview-container {
      width: 64px;
      height: 96px;
      aspect-ratio: 16 / 9;
      background-color: #f5f5f5;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.15);
    }
    .preview-container img,
    .preview-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .preview-container video {
      background-color: #000;
    }
    .info {
      flex: 1;
      padding: 0 10px;
      min-width: 0;
    }
    .info p {
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 14px;
      color: #333;
    }
    button {
      padding: 6px 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-left: 6px;
      flex-shrink: 0;
    }
    .copy {
      background: #409eff;
      color: white;
    }
    .del {
      background: #f56c6c;
      color: white;
    }
    input {
      padding: 6px;
      width: 100%;
      margin-top: 6px;
    }
    .empty {
      padding: 20px;
      text-align: center;
      color: #999;
      border: 1px dashed #eee;
      border-radius: 8px;
    }
    
    /* Tab 样式 */
    .tabs {
      display: flex;
      border-bottom: 1px solid #eee;
      margin-bottom: 20px;
    }
    .tab {
      padding: 10px 20px;
      cursor: pointer;
      border: none;
      background: none;
      font-size: 14px;
      font-weight: 500;
      color: #666;
      margin-left: 0;
      border-radius: 4px 4px 0 0;
      transition: all 0.3s;
    }
    .tab.active {
      color: #409eff;
      background: #f5f7fa;
    }
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    /* 预览弹窗 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      cursor: pointer;
    }
    .modal-content {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      cursor: default;
    }
    .modal-content video {
      max-width: 90vw;
      max-height: 90vh;
    }
    
    /* 轻提示样式 */
    .toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 14px;
      z-index: 99999;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <h2>GitHub 图床/视频 管理工具</h2>
  <div id="tokenInput" style="margin-bottom: 20px; padding: 15px; background: #f5f5f5; border-radius: 8px;">
    <label>GitHub Access Token:</label><br>
    <input type="password" id="tokenField" placeholder="请输入你的 GitHub Personal Access Token" style="width: 100%; max-width: 500px; margin-top: 8px;">
    <button onclick="setToken()" style="margin-left: 10px; background: #409eff; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;">确认</button>
    <p style="font-size: 12px; color: #666; margin-top: 8px;">提示：Token 需要有 repo 权限，且不要分享给他人</p>
  </div>

  <!-- Tab 切换 -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('image')">图片管理</button>
    <button class="tab" onclick="switchTab('video')">视频管理</button>
  </div>

  <!-- 图片 Tab -->
  <div id="imageTab" class="tab-content active">
    <h3>已上传图片列表</h3>
    <div id="imageList"></div>
    <input type="file" id="imageFileInput" accept="image/*">
    <div id="imageResult" style="margin-top:20px;"></div>
  </div>

  <!-- 视频 Tab -->
  <div id="videoTab" class="tab-content">
    <h3>已上传视频列表</h3>
    <div id="videoList"></div>
    <input type="file" id="videoFileInput" accept="video/*">
    <div id="videoResult" style="margin-top:20px;"></div>
  </div>

  <!-- 预览弹窗 -->
  <div id="previewModal" class="modal-overlay" style="display: none;" onclick="closePreview()">
    <div id="previewContent"></div>
  </div>

  <!-- 轻提示 -->
  <div id="toast" class="toast"></div>

  <script>
    // ========== 配置项 ==========
    const REPO = "cz-liang/lcz-image-bed";
    const BRANCH = "main";
    const IMAGE_PATH = "images/";
    const VIDEO_PATH = "videos/";
    // GitHub Token 将在使用时由用户输入
    let GITHUB_TOKEN = '';
    // =============================

    let imageListCache = [];
    let videoListCache = [];

    function setToken() {
      const token = document.getElementById('tokenField').value.trim();
      if (token) {
        GITHUB_TOKEN = token;
        localStorage.setItem('github_token', token);
        showToast('Token 设置成功！');
        getImageList();
        getVideoList();
      } else {
        showToast('请输入有效的 Token');
      }
    }

    window.onload = function() {
      const savedToken = localStorage.getItem('github_token');
      if (savedToken) {
        GITHUB_TOKEN = savedToken;
        document.getElementById('tokenField').value = savedToken;
        getImageList();
        getVideoList();
      } else {
        document.getElementById('imageList').innerHTML = '<div class="empty">请先输入 GitHub Token</div>';
        document.getElementById('videoList').innerHTML = '<div class="empty">请先输入 GitHub Token</div>';
      }
    };

    function switchTab(tabName) {
      document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById(tabName + 'Tab').classList.add('active');
      
      if (tabName === 'image' && imageListCache.length === 0 && GITHUB_TOKEN) {
        getImageList();
      } else if (tabName === 'video' && videoListCache.length === 0 && GITHUB_TOKEN) {
        getVideoList();
      }
    }

    // 获取图片列表
    async function getImageList() {
      if (!GITHUB_TOKEN) {
        document.getElementById('imageList').innerHTML = '<div class="empty">请先输入 GitHub Token</div>';
        return;
      }
      try {
        const response = await fetch(
          `https://api.github.com/repos/${REPO}/contents/${IMAGE_PATH}?t=${new Date().getTime() + Math.random()}`,
          {
            method: 'GET',
            headers: {
              Authorization: `token ${GITHUB_TOKEN}`
            },
            cache: 'no-store'
          }
        );
        
        if (response.status === 404) {
          imageListCache = [];
          renderImageList();
          return;
        }
        
        imageListCache = await response.json();
        renderImageList();
      } catch (e) {
        console.error('Error:', e);
      }
    }

    // 获取视频列表
    async function getVideoList() {
      if (!GITHUB_TOKEN) {
        document.getElementById('videoList').innerHTML = '<div class="empty">请先输入 GitHub Token</div>';
        return;
      }
      try {
        const response = await fetch(
          `https://api.github.com/repos/${REPO}/contents/${VIDEO_PATH}?t=${new Date().getTime() + Math.random()}`,
          {
            method: 'GET',
            headers: {
              Authorization: `token ${GITHUB_TOKEN}`
            },
            cache: 'no-store'
          }
        );
        
        if (response.status === 404) {
          videoListCache = [];
          renderVideoList();
          return;
        }
        
        videoListCache = await response.json();
        renderVideoList();
      } catch (e) {
        console.error('Error:', e);
      }
    }

    // 渲染图片列表
    function renderImageList() {
      const dom = document.getElementById("imageList");
      dom.innerHTML = "";
      if (!imageListCache || imageListCache.length === 0) {
        dom.innerHTML = '<div class="empty">暂无图片，请上传</div>';
        return;
      }
      imageListCache.forEach(item => {
        if (item.type === "file") {
          const url = `https://cdn.jsdelivr.net/gh/${REPO}@${BRANCH}/${IMAGE_PATH}${item.name}`;
          dom.innerHTML += `
            <div class="item" data-name="${item.name}">
              <div class="preview-container" onclick="openPreview('${url}', 'image')">
                <img src="${url}" alt="${item.name}">
              </div>
              <div class="info"><p>${item.name}</p></div>
              <button class="copy" onclick="copy('${url}')">复制链接</button>
              <button class="del" onclick="delFile('${IMAGE_PATH}', '${item.name}', '${item.sha}', 'image')">删除</button>
            </div>
          `;
        }
      });
    }

    // 渲染视频列表
    function renderVideoList() {
      const dom = document.getElementById("videoList");
      dom.innerHTML = "";
      if (!videoListCache || videoListCache.length === 0) {
        dom.innerHTML = '<div class="empty">暂无视频，请上传</div>';
        return;
      }
      videoListCache.forEach(item => {
        if (item.type === "file") {
          const url = `https://cdn.jsdelivr.net/gh/${REPO}@${BRANCH}/${VIDEO_PATH}${item.name}`;
          dom.innerHTML += `
            <div class="item" data-name="${item.name}">
              <div class="preview-container" onclick="openPreview('${url}', 'video')">
                <video src="${url}" muted loop playsinline></video>
              </div>
              <div class="info"><p>${item.name}</p></div>
              <button class="copy" onclick="copy('${url}')">复制链接</button>
              <button class="del" onclick="delFile('${VIDEO_PATH}', '${item.name}', '${item.sha}', 'video')">删除</button>
            </div>
          `;
        }
      });
    }

    // 打开预览
    function openPreview(url, type) {
      const modal = document.getElementById('previewModal');
      const content = document.getElementById('previewContent');
      
      if (type === 'image') {
        content.innerHTML = `<img src="${url}" class="modal-content" onclick="event.stopPropagation()">`;
      } else {
        content.innerHTML = `<video src="${url}" class="modal-content" controls onclick="event.stopPropagation()"></video>`;
      }
      
      modal.style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }

    // 关闭预览
    function closePreview() {
      const modal = document.getElementById('previewModal');
      modal.style.display = 'none';
      document.body.style.overflow = '';
    }

    // 轻提示
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 1500);
    }

    // 复制
    function copy(url) {
      const input = document.createElement("input");
      input.value = url;
      document.body.appendChild(input);
      input.select();
      document.execCommand("copy");
      document.body.removeChild(input);
      showToast("复制成功！");
    }

    // 删除文件
    async function delFile(path, name, sha, type) {
      if (!GITHUB_TOKEN) {
        showToast('请先输入 GitHub Token');
        return;
      }
      if (!confirm("确定删除这个文件？")) return;
      try {
        await axios({
          method: "delete",
          url: `https://api.github.com/repos/${REPO}/contents/${path}${name}`,
          headers: {
            Authorization: `token ${GITHUB_TOKEN}`
          },
          data: {
            message: "delete file",
            sha: sha,
            branch: BRANCH
          },
          params: { t: new Date().getTime() }
        });

        if (type === 'image') {
          getImageList();
        } else {
          getVideoList();
        }
        showToast("删除成功！");
      } catch (err) {
        showToast("删除失败");
        console.log(err);
      }
    }

    // 上传文件
    async function uploadFile(file, path, resultId, listFunc, type) {
      if (!GITHUB_TOKEN) {
        showToast('请先输入 GitHub Token');
        return;
      }
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = async () => {
        const base64Str = reader.result.split(',')[1];
        const fileName = file.name;
        const filePath = `${path}${fileName}`;

        try {
          await axios({
            method: 'put',
            url: `https://api.github.com/repos/${REPO}/contents/${filePath}`,
            headers: { Authorization: `token ${GITHUB_TOKEN}` },
            data: { message: 'upload', content: base64Str, branch: BRANCH }
          });
        } catch (e) {
          if (e.response?.status === 404) {
            await axios({
              method: 'put',
              url: `https://api.github.com/repos/${REPO}/contents/${path}.gitkeep`,
              headers: { Authorization: `token ${GITHUB_TOKEN}` },
              data: { message: 'create folder', content: '', branch: BRANCH }
            });
            await axios({
              method: 'put',
              url: `https://api.github.com/repos/${REPO}/contents/${filePath}`,
              headers: { Authorization: `token ${GITHUB_TOKEN}` },
              data: { message: 'upload', content: base64Str, branch: BRANCH }
            });
          }
          if (e.response?.status === 422) {
            showToast('上传失败：已存在同名文件！');
            return;
          }
        }

        const url = `https://cdn.jsdelivr.net/gh/${REPO}@${BRANCH}/${filePath}`;
        const previewElement = type === 'image' 
          ? `<img src="${url}" width="300">`
          : `<video src="${url}" width="300" controls></video>`;
        
        document.getElementById(resultId).innerHTML = `
          <p>上传成功！</p>
          ${previewElement}
          <input value="${url}" style="width:100%">
        `;
        listFunc();
      };
    }

    // 图片上传
    document.getElementById('imageFileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      uploadFile(file, IMAGE_PATH, 'imageResult', getImageList, 'image');
    });

    // 视频上传
    document.getElementById('videoFileInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      uploadFile(file, VIDEO_PATH, 'videoResult', getVideoList, 'video');
    });
  </script>
</body>
</html>
